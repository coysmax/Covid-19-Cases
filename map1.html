<!DOCTYPE html>
<html>

        #map {

            width: 100%;

            position: absolute;
            bottom: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.8);

            padding: 10px;
            max-width: 250px;
            line-height: 1.3;

        .map-overlay p {

        }

        .legend-item {

            font-size: 12px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;

            font-size: 24px;
            color: #333;
        }

        .title-container p {
            margin: 5px 0;
            font-size: 12px;
            color: #666;
        }

        .popup-content {
            font-size: 12px;
        }

        .popup-content p {
            margin: 5px 0;
        }
    </style>
</head>
